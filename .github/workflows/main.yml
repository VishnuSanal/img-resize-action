name: Resize Image

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

jobs:
  sanitize-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Run Resize Image
        uses: VishnuSanal/img-resize-action@628a3259d1da6f8b931083d0dffaf0add8124664
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          width: 600
          height: 800
